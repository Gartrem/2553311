name: Live Pages smoke test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/live-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the published site and verify it
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gartrem.github.io/2553311/"
          BODY="/tmp/site.html"

          ok=0
          for i in $(seq 1 24); do
            if curl -fsSL --max-time 20 "$URL" -o "$BODY"; then
              if grep -q "Проектируем" "$BODY" && ! grep -q "premium redesign" "$BODY"; then
                ok=1
                break
              fi
            fi
            echo "Attempt $i: live site is not updated yet"
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "Live homepage did not become the built site"
            exit 1
          fi

          grep -q "Ателье Авторского Ремонта" "$BODY"
          grep -q "/2553311/_next/static/css/" "$BODY"

          for path in "projects/" "services/" "about/" "process/" "contacts/" "projects/european-shore/"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "${URL}${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done

          logo_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://gartrem.github.io/2553311/assets/logo-white.png")
          echo "logo -> $logo_code"
          test "$logo_code" = "200"

          css_path=$(grep -o '/2553311/_next/static/css/[^"]*\.css' "$BODY" | head -n 1)
          css_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://gartrem.github.io${css_path}")
          echo "css -> $css_code"
          test "$css_code" = "200"

          echo "LIVE_SITE_SMOKE_TEST_PASSED"
