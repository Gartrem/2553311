name: Build and publish static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "site-build"
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Publish static site to Pages source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Copy export to repository root
        run: |
          rm -rf _next assets about contacts process projects services
          rm -f index.html 404.html index.txt about.txt contacts.txt process.txt projects.txt services.txt
          cp -R out/. .
          touch .nojekyll

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Publish static site to Pages source"
            git push
          fi
